name: Card review

on:
  pull_request:
    branches:
      - main
    paths:
      - "cards/**"
      - "tools/**"
      - "package.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review:
    name: Review changed cards
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch main
        run: git fetch origin main:refs/remotes/origin/main

      - name: Deterministic card review
        run: python3 tools/review_new_cards.py --base origin/main

      - name: Optional LLM card review
        env:
          LITE_LLM_BASE_URL: ${{ vars.LITE_LLM_BASE_URL }}
          LITE_LLM_MODEL: ${{ vars.LITE_LLM_MODEL }}
          LITE_LLM_KEY: ${{ secrets.LITE_LLM_KEY }}
        run: python3 tools/review_new_cards_llm.py --base origin/main --optional
